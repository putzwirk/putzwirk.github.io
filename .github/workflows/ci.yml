name: CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: RLS matrix tests
        run: npm run test:rls
      - name: Edge Function unit tests
        run: npm run test:functions
      - name: Edge Function typecheck
        run: npm run check:functions
      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
